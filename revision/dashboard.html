<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDD-11 · 数据准备进度</title>
<style>
:root{color-scheme:light;--ink:#172b3d;--muted:#677888;--line:#e1e8ec;--green:#117d70;--pale:#e9f5f1;--bg:#f4f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
header{background:#172c3c;color:#fff;padding:17px max(24px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:14px;letter-spacing:.04em}.live{font-size:12px;color:#bee2d5;display:flex;align-items:center;gap:8px}.dot{height:7px;width:7px;border-radius:100%;background:#66c6a9}.live.off{color:#ffd5a5}.live.off .dot{background:#efbc74}
main{max-width:1128px;padding:35px 24px 24px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--green);font-weight:650}h1{margin:7px 0 6px;font-size:29px;font-weight:650;letter-spacing:-.03em}.subtitle{color:var(--muted);margin:0 0 25px;font-size:13px}
.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:25px;margin-bottom:18px}.hero{display:grid;grid-template-columns:1fr 300px;gap:34px}.section-label{font-size:13px;color:var(--muted)}.big{font-size:58px;line-height:1.2;letter-spacing:-.04em;font-weight:600;margin:12px 0 8px}.big small{font-size:26px;font-weight:400;letter-spacing:0;margin-left:3px}.amount{font-size:14px;color:var(--muted)}.track{height:9px;background:#eaf0f1;border-radius:9px;overflow:hidden;margin:19px 0 12px}.fill{height:100%;width:0;background:var(--green);border-radius:inherit;transition:width .5s ease}.stats{display:flex;gap:38px;border-top:1px solid var(--line);margin-top:20px;padding-top:17px}.stat strong{display:block;margin-top:4px;font-size:18px;font-weight:600}.stat span{font-size:12px;color:var(--muted)}.chart-box{align-self:center;border-left:1px solid var(--line);padding-left:25px}.chart-title{font-size:13px;color:var(--muted);margin-bottom:9px}svg{width:100%;height:140px;display:block}.chart-footer{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:7px}.estimate{font-size:11px;color:var(--muted);margin-top:11px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:18px}.file-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.file-title{font-size:16px;font-weight:600}.filename{color:var(--muted);font-size:12px;margin-top:3px}.badge{font-size:11px;border-radius:20px;padding:4px 10px;background:#f0f3f5;color:#5d6c79;white-space:nowrap}.badge.active{background:var(--pale);color:var(--green)}.badge.done{background:#deeee7;color:#17604b}.file-bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.file-bottom strong{color:var(--ink)}
h2{font-size:15px;margin:0 0 22px;font-weight:600}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stage{border-top:3px solid #dce5e9;padding-top:12px}.stage.active{border-color:var(--green)}.stage.done{border-color:#7ebaaa}.stage-num{font-size:11px;color:#8996a0;margin-bottom:3px}.stage-name{font-size:14px;font-weight:600}.stage-state{font-size:12px;color:var(--muted);margin-top:5px}.stage.active .stage-state{color:var(--green)}
details{border-top:1px solid var(--line);padding-top:16px;margin-top:22px}summary{cursor:pointer;font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fa;padding:14px;border-radius:7px;font:11px/1.7 Consolas,"Microsoft YaHei",monospace;max-height:220px;overflow:auto}.footer{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}.alert{border:1px solid #e7cead;background:#fff8ec;border-radius:8px;padding:11px 15px;margin-bottom:16px;font-size:12px;color:#7b562b}.hidden{display:none}.config{display:flex;gap:25px;margin-top:17px;font-size:12px;color:var(--muted);flex-wrap:wrap}.config b{font-weight:600;color:var(--ink)}button{background:transparent;border:1px solid #d4dfe4;border-radius:6px;padding:5px 12px;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}button:hover{background:#edf4f4}
@media(max-width:740px){main{padding:25px 15px}.hero{grid-template-columns:1fr;gap:20px}.chart-box{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.files{grid-template-columns:1fr;gap:0}.panel{padding:20px}.stages{grid-template-columns:1fr 1fr;gap:22px}.big{font-size:48px}.footer{flex-direction:column;gap:6px}.stats{gap:28px}.brand{font-size:12px}header{padding:15px}.config{gap:12px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<header><div class="brand">HVI–CIDNet <span style="opacity:.45;margin:0 12px">/</span> 返修实验</div><div id="connection" class="live off"><span class="dot"></span><span id="connectionText">正在连接服务器</span></div></header>
<main>
<div class="eyebrow">数据准备 · CDD-11</div>
<h1>下载与处理进度</h1>
<p class="subtitle">Ubuntu 服务器 · 192.168.5.42 <span style="margin:0 9px;color:#b5c2ca">/</span> 每 10 秒自动更新</p>
<div id="alert" class="alert hidden" role="status"></div>
<section class="panel hero" aria-label="总体下载进度">
<div><div class="section-label" id="phaseTitle">等待服务器状态</div><div class="big"><span id="percent">—</span><small>%</small></div><div class="amount"><span id="downloaded">—</span> / <span id="total">—</span></div><div class="track" role="progressbar" id="overallBar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="overallFill"></div></div><div class="stats"><div class="stat"><span>接收速度 · 近 90 秒</span><strong id="speed">采样中</strong></div><div class="stat"><span>下载预计剩余</span><strong id="eta">计算中</strong></div></div><div class="estimate">按 HTTP 分段实际接收字节统计；下载完成后继续校验文件完整性。</div></div>
<div class="chart-box"><div class="chart-title">累计下载量</div><svg viewBox="0 0 300 140" role="img" aria-label="最近下载进度趋势"><line x1="0" y1="124" x2="300" y2="124" stroke="#e1e8ec"/><line x1="0" y1="66" x2="300" y2="66" stroke="#edf1f3" stroke-dasharray="4 5"/><path id="chartArea" fill="#e9f5f1" d=""/><path id="chartLine" fill="none" stroke="#117d70" stroke-width="2.5" stroke-linecap="round" d=""/><text id="chartEmpty" x="150" y="75" text-anchor="middle" fill="#8a99a5" font-size="12">正在收集进度数据</text></svg><div class="chart-footer"><span id="chartStart">—</span><span id="chartEnd">当前</span></div><div class="config"><span>训练 <b>600</b> 场景</span><span>验证 <b>100</b> 场景</span><span>测试 <b>200</b> 场景</span></div></div>
</section>
<div class="files" id="files"></div>
<section class="panel"><h2>处理流程</h2><div class="stages" id="stages"></div><details><summary>查看处理日志与数据位置</summary><pre id="log">等待状态更新…</pre><div class="estimate" id="dataRoot"></div></details></section>
<div class="footer"><span id="updated">最近更新：等待连接</span><span>关闭页面不会中断服务器下载 <button id="refresh" style="margin-left:10px">刷新显示</button></span></div>
</main>
<script>
const $=id=>document.getElementById(id);
let busy=false;
/** 将字节数转换为适合阅读的二进制单位。 */
function bytes(n){if(n==null)return '—';return n>=1073741824?(n/1073741824).toFixed(2)+' GiB':(n/1048576).toFixed(1)+' MiB';}
/** 将估算秒数转换为时分，样本不足时不伪造预计时间。 */
function duration(n){if(n==null||!Number.isFinite(n))return '计算中';if(n<=0)return '已下载';let m=Math.ceil(n/60);return m>=60?Math.floor(m/60)+' 小时 '+m%60+' 分':m+' 分钟';}
/** 使用文本节点创建数据包卡片，避免将服务器日志当成页面代码。 */
function fileCard(f){let el=document.createElement('section');el.className='panel';el.innerHTML='<div class="file-head"><div><div class="file-title"></div><div class="filename"></div></div><span class="badge"></span></div><div class="track"><div class="fill"></div></div><div class="file-bottom"><span></span><strong></strong></div>';let p=100*f.written_bytes/f.total_bytes;el.querySelector('.file-title').textContent=f.label;el.querySelector('.filename').textContent=f.name;let badge=el.querySelector('.badge');badge.textContent=f.verified?'完整性已验证':f.downloaded?'已下载 · 等待校验':f.written_bytes>0?'下载中':'等待下载';badge.className='badge '+(f.verified?'done':f.written_bytes>0?'active':'');el.querySelector('.fill').style.width=p+'%';el.querySelector('.file-bottom span').textContent=bytes(f.written_bytes)+' / '+bytes(f.total_bytes);el.querySelector('.file-bottom strong').textContent=p.toFixed(1)+'%';return el;}
/** 根据实际文件标记展示各阶段，不把下载百分比当作全流程完成度。 */
function stages(d){const phase=d.state.phase;const allDownload=d.files.every(f=>f.downloaded), allVerify=d.files.every(f=>f.verified), allExtract=d.files.every(f=>f.extracted);const defs=[['下载数据',allDownload,phase==='download'&&!allDownload],['完整性校验',allVerify,phase==='download'&&d.files.some(f=>f.downloaded&&!f.verified)],['解压文件',allExtract,phase==='extract'],['审计与固定划分',phase==='complete',phase==='audit_and_manifest']];$('stages').replaceChildren(...defs.map((s,i)=>{let el=document.createElement('div');el.className='stage '+(s[1]?'done':s[2]?'active':'');el.innerHTML='<div class="stage-num">0'+(i+1)+'</div><div class="stage-name"></div><div class="stage-state"></div>';el.querySelector('.stage-name').textContent=s[0];el.querySelector('.stage-state').textContent=s[1]?'已完成':s[2]?'进行中':'等待前序完成';return el;}));}
/** 绘制最近采样点的累计下载趋势，横轴采用真实采样时间。 */
function chart(history){if(!history||history.length<2)return;let first=history[0],last=history.at(-1),min=first.bytes,max=last.bytes;let range=Math.max(max-min,1048576);let pts=history.map(h=>[(h.time-first.time)/Math.max(last.time-first.time,1)*300,124-(h.bytes-min)/range*110]);let line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');$('chartLine').setAttribute('d',line);$('chartArea').setAttribute('d',line+' L300,124 L0,124 Z');$('chartEmpty').style.display='none';$('chartStart').textContent=new Date(first.time*1000).toLocaleTimeString('zh-CN',{hour12:false});$('chartEnd').textContent=new Date(last.time*1000).toLocaleTimeString('zh-CN',{hour12:false});}
/** 用服务器快照更新页面；断连时保留旧进度并显示明确提示。 */
function render(d){$('connection').className='live '+(d.connected?'':'off');$('connectionText').textContent=d.connected?'已连接 · 自动更新':d.loading?'正在连接服务器':'连接暂时中断';let message=d.connected?'':d.loading?'':d.connection_error;if(d.state?.phase==='failed')message='数据准备出现异常，请查看处理日志。';$('alert').textContent=message||'';$('alert').classList.toggle('hidden',!message);if(!d.files)return;let p=100*d.written_bytes/d.total_bytes;$('percent').textContent=p.toFixed(1);$('overallFill').style.width=p+'%';$('overallBar').setAttribute('aria-valuenow',p.toFixed(1));$('downloaded').textContent=bytes(d.written_bytes);$('total').textContent=bytes(d.total_bytes);$('speed').textContent=d.bytes_per_second==null?'采样中':bytes(d.bytes_per_second)+'/秒';$('eta').textContent=d.written_bytes>=d.total_bytes?'已下载':duration(d.eta_seconds);const phaseNames={download:'正在下载官方数据包',extract:'下载完成，正在解压',audit_and_manifest:'正在审计配对并生成清单',complete:'数据准备已完成',failed:'数据准备需要处理',waiting:'等待数据准备开始'};$('phaseTitle').textContent=phaseNames[d.state.phase]||d.state.phase;$('files').replaceChildren(...[...d.files].reverse().map(fileCard));stages(d);chart(d.history);$('log').textContent=d.log?.join('\n')||'暂无日志';$('dataRoot').textContent=d.root;$('updated').textContent='最近更新：'+new Date(d.observed_at*1000).toLocaleString('zh-CN',{hour12:false})+(d.connected?'':'（上次成功采样）');}
/** 定时读取本地只读接口；同一时刻最多保留一个请求。 */
async function update(){if(busy)return;busy=true;try{let r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('连接失败');render(await r.json());}catch(e){$('connection').className='live off';$('connectionText').textContent='本地进度服务未连接';$('alert').textContent='进度页面连接失败；服务器下载独立运行，不受页面影响。';$('alert').classList.remove('hidden');}finally{busy=false;}}
$('refresh').addEventListener('click',update);update();setInterval(update,3000);
</script>
</body>
</html>
